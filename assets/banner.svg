<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#090d11"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#3fb950"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#21262d" stop-opacity=".8"/><stop offset="100%" stop-color="#161b22" stop-opacity=".6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#30363d" stroke-opacity=".3" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter></defs><style>@keyframes pulse-wave{0%{stroke-dashoffset:600;opacity:.3}50%{opacity:.9}}@keyframes float-particle{0%{transform:translateY(0);opacity:.2}50%{transform:translateY(-15px);opacity:.8}}@keyframes live-dot{0%{r:4px;opacity:1}50%{r:8px;opacity:.4}}.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#8b949e}.badge-text{font-weight:600;font-size:13px;fill:#58a6ff}.badge-text,.metric-lbl,.metric-val{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.metric-val{font-weight:700;font-size:18px;fill:#f0f6fc}.metric-lbl{font-size:12px;fill:#8b949e}.wave-line{stroke:url(#primary-glow);stroke-width:2.5;fill:none;stroke-dasharray:200 400;animation:pulse-wave 8s linear infinite}.particle-1{animation:float-particle 4s ease-in-out infinite}.particle-2{animation:float-particle 6s ease-in-out infinite 1s}.particle-3{animation:float-particle 5s ease-in-out infinite 2s}.status-ping{animation:live-dot 2s ease-in-out infinite;fill:#3fb950}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><rect width="1200" height="4" x="0" y="0" fill="url(#primary-glow)"/><g opacity=".6"><path d="M 650 250 Q 750 180, 850 220 T 1050 140 T 1180 180" class="wave-line"/><path d="M 600 280 Q 720 220, 820 260 T 1000 190 T 1150 220" class="wave-line" opacity=".5" style="animation-duration:12s"/><circle cx="720" cy="140" r="4" fill="#58a6ff" class="particle-1"/><circle cx="900" cy="100" r="6" fill="#bc8cff" class="particle-2"/><circle cx="1080" cy="220" r="5" fill="#3fb950" class="particle-3"/></g><g filter="url(#soft-shadow)" transform="translate(780, 70)"><rect width="170" height="90" x="0" y="0" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" rx="10"/><text x="16" y="32" class="metric-lbl">QUERY LATENCY</text><text x="16" y="60" class="metric-val">0.42 ms</text><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-width="2" d="M 110 60 L 125 45 L 135 52 L 150 38"/><rect width="170" height="90" x="190" y="0" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" rx="10"/><text x="206" y="32" class="metric-lbl">DB CLUSTER STATUS</text><text x="228" y="60" class="metric-val">Optimal</text><circle cx="214" cy="54" class="status-ping"/><rect width="270" height="90" x="90" y="110" fill="url(#card-grad)" stroke="#30363d" stroke-width="1" rx="10"/><text x="106" y="142" class="metric-lbl">ANOMALY DETECTION</text><text x="106" y="170" class="metric-val">Zero Slow Queries</text><rect width="60" height="20" x="280" y="152" fill="#238636" opacity=".3" rx="10"/><text x="310" y="166" fill="#3fb950" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text></g><g><g transform="translate(70, 0) translate(0, 75)"><rect width="230" height="32" x="0" y="0" fill="#1f6feb" fill-opacity=".15" stroke="#58a6ff" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="4" fill="#58a6ff"/><text x="30" y="21" class="badge-text">CURATED OBSERVABILITY DIRECTORY</text></g><text x="0" y="165" class="title" filter="url(#soft-shadow)" transform="translate(70, 0)">Awesome Database Observability ⚡</text><text x="0" y="215" class="subtitle" transform="translate(70, 0)">Monitoring • Slow Query Analytics • Performance Insights • APM Integration</text><g transform="translate(70, 0) translate(0, 260)"><rect width="130" height="30" x="0" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="65" y="19" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">🐘 PostgreSQL</text><rect width="110" height="30" x="142" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="197" y="19" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">🐬 MySQL</text><rect width="120" height="30" x="264" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="324" y="19" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">🍃 MongoDB</text><rect width="130" height="30" x="396" y="0" fill="#21262d" stroke="#30363d" rx="6"/><text x="461" y="19" fill="#c9d1d9" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">☁️ SaaS &amp; OSS</text></g></g></svg>