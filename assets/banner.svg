<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.7" stroke-opacity="0.3"/>
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #58a6ff; }
    .metric-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #f0f6fc; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }

    /* Keyframe Animations for Dynamic Elements in Background */
    @keyframes pulse-wave {
      0% { stroke-dashoffset: 600; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    @keyframes live-dot {
      0% { r: 4px; opacity: 1; }
      50% { r: 8px; opacity: 0.4; }
      100% { r: 4px; opacity: 1; }
    }

    .wave-line {
      stroke: url(#primary-glow);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 200 400;
      animation: pulse-wave 8s linear infinite;
    }

    .particle-1 { animation: float-particle 4s ease-in-out infinite; }
    .particle-2 { animation: float-particle 6s ease-in-out infinite 1s; }
    .particle-3 { animation: float-particle 5s ease-in-out infinite 2s; }
    .status-ping { animation: live-dot 2s ease-in-out infinite; fill: #3fb950; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primary-glow)"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind or to the side so text is clear) -->
  <g opacity="0.6">
    <!-- Animated Chart Lines in right/background area -->
    <path class="wave-line" d="M 650 250 Q 750 180, 850 220 T 1050 140 T 1180 180" />
    <path class="wave-line" d="M 600 280 Q 720 220, 820 260 T 1000 190 T 1150 220" opacity="0.5" style="animation-duration: 12s;"/>
    
    <!-- Floating Data Nodes -->
    <circle class="particle-1" cx="720" cy="140" r="4" fill="#58a6ff" />
    <circle class="particle-2" cx="900" cy="100" r="6" fill="#bc8cff" />
    <circle class="particle-3" cx="1080" cy="220" r="5" fill="#3fb950" />
  </g>

  <!-- SIDE METRIC CARDS (Right side background graphic) -->
  <g transform="translate(780, 70)" filter="url(#soft-shadow)">
    <!-- Card 1: QPS / Performance -->
    <rect x="0" y="0" width="170" height="90" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="32" class="metric-lbl">QUERY LATENCY</text>
    <text x="16" y="60" class="metric-val">0.42 ms</text>
    <path d="M 110 60 L 125 45 L 135 52 L 150 38" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Card 2: Health / Status -->
    <rect x="190" y="0" width="170" height="90" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1"/>
    <text x="206" y="32" class="metric-lbl">DB CLUSTER STATUS</text>
    <text x="228" y="60" class="metric-val">Optimal</text>
    <circle class="status-ping" cx="214" cy="54" />

    <!-- Card 3: Slow Query Insights -->
    <rect x="90" y="110" width="270" height="90" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1"/>
    <text x="106" y="142" class="metric-lbl">ANOMALY DETECTION</text>
    <text x="106" y="170" class="metric-val">Zero Slow Queries</text>
    <rect x="280" y="152" width="60" height="20" rx="10" fill="#238636" opacity="0.3"/>
    <text x="310" y="166" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- MAIN FOREGROUND TEXT CONTENT (Guaranteed high visibility and contrast) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#1f6feb" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#58a6ff"/>
      <text x="30" y="21" class="badge-text">CURATED OBSERVABILITY DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title" filter="url(#soft-shadow)">
      Awesome Database Observability ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle">
      Monitoring • Slow Query Analytics • Performance Insights • APM Integration
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 260)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="65" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">🐘 PostgreSQL</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="110" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="197" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">🐬 MySQL</text>

      <!-- Tag 3 -->
      <rect x="264" y="0" width="120" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="324" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">🍃 MongoDB</text>

      <!-- Tag 4 -->
      <rect x="396" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="461" y="19" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">☁️ SaaS &amp; OSS</text>
    </g>
  </g>
</svg>
